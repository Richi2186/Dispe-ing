:root {

    --card-border: #1e2d4a;

}

* {

}

body {

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-gradient);

    color: var(--text-main);

    -webkit-tap-highlight-color: transparent;

/* HEADER */

    text-align: center;
}

.logo {

    height: 65px;
    border-radius: 50%;
    margin-bottom: 8px;
}

.header h1 {

    font-size: 28px;

}

}

#datetime {

    color: #38bdf8;

#stats {
    text-align: center;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-sub);
    padding: 0 20px;
    word-break: break-all;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 20px;
}

/* SEARCH BOX */
.search-wrapper {
    position: relative;
    margin: 20px 0 30px;
}

.search-wrapper i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #5d7290;
    width: 18px;
    height: 18px;
}

#searchBox {
    width: 100%;
    padding: 14px 16px 14px 48px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    background: var(--search-bg);
    color: var(--text-main);
    outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}

#searchBox::placeholder {
    color: #5d7290;
}

#searchBox:focus {
    border-color: #38bdf8;
}

/* HEADINGS */
h2 {
    margin: 25px 0 15px;
    color: var(--text-main);
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

h2 .h-icon {
    color: #f59e0b;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
}

a {
    text-decoration: none;
}

/* CARD DESIGN (PODLA OBRÁZKA 1) */
.card {
    height: 72px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--card-accent, #3b82f6); /* Farebný ľavý okraj */
    color: var(--text-main);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 14px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
}

/* FAREBNÝ ŠTVOREC PRE IKONU */
.card-icon-box {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--card-accent, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #ffffff;
}

.card-icon-box i {
    width: 20px;
    height: 20px;
}

.card-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: #ffffff;
}

/* FARBY KARIET A IKON */
.c-blue    { --card-accent: #2563eb; }
.c-orange  { --card-accent: #f97316; }
.c-amber   { --card-accent: #d97706; }

<script>
lucide.createIcons();

function updateTime() {
    let now = new Date();
    document.getElementById("date-part").innerText = now.toLocaleDateString("sk-SK");
    document.getElementById("time-part").innerText = now.toLocaleTimeString("sk-SK");
}
setInterval(updateTime, 1000);
updateTime();

/* STATS */
function countClick(name) {
    let data = JSON.parse(localStorage.getItem("stats")) || {};
    data[name] = (data[name] || 0) + 1;
    localStorage.setItem("stats", JSON.stringify(data));
    showStats();
}

function showStats() {
    let data = JSON.parse(localStorage.getItem("stats")) || {};
    let items = [];

    for (let key in data) {
        items.push(key + ": " + data[key]);
    }

    if (items.length > 0) {
        document.getElementById("stats").innerHTML = "📊 Kliknutia: " + items.join(" | ");
    }
}

showStats();

/* SEARCH TILES */
function searchTiles() {
    let filter = document.getElementById("searchBox").value.toLowerCase();
    let tiles = document.querySelectorAll(".tile");

    tiles.forEach(tile => {
        tile.style.display = tile.innerText.toLowerCase().includes(filter) ? "" : "none";
    });
}

/* SERVICE WORKER FOR PWA */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js', { scope: './' })
      .then(reg => console.log('Service Worker OK', reg))
      .catch(err => console.error('Chyba SW', err));
  });
}
</script>
